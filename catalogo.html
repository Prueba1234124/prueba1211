<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Carros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-catalogo">
    
    <header class="header-rustico">
        <h1>Colección Exclusiva</h1>
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </header>
    
    <main class="grid-catalogo">
        <!-- Carro 1 -->
        <div class="tarjeta-carro">
            <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=800&q=80" alt="Carro Clásico">
            <div class="info-carro">
                <h2>Clásico Restaurado</h2>
                <p>Elegancia atemporal con interiores de cuero y detalles en madera pura.</p>
            </div>
        </div>

        <!-- Carro 2 -->
        <div class="tarjeta-carro">
            <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=800&q=80" alt="Carro Deportivo">
            <div class="info-carro">
                <h2>Gran Turismo</h2>
                <p>Potencia moderna envuelta en un chasis azul cobalto profundo.</p>
            </div>
        </div>

        <!-- Carro 3 -->
        <div class="tarjeta-carro">
            <img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&w=800&q=80" alt="Carro Todoterreno">
            <div class="info-carro">
                <h2>Edición Safari</h2>
                <p>Acabados rústicos en bronce para dominar cualquier terreno con estilo.</p>
            </div>
        </div>
    </main>

</body>
</html>
