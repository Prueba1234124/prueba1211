<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Prototipo Beta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-catalogo">
    
    <header class="header-rustico">
        <h1>Catálogo de Vehículos <span class="tag-beta">PROTOTIPO BETA</span></h1>
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </header>
    
    <h2 class="seccion-titulo">Pick-ups</h2>
    <section class="grid-catalogo">
        <!-- Tarjeta clickeable -->
        <div class="tarjeta-carro" onclick="abrirModal('hilux')">
            <div class="badge-disponible"><span class="punto-verde"></span> Disponible</div>
            <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80" alt="Toyota Hilux">
            <div class="info-carro">
                <h2>Toyota Hilux</h2>
                <p>Haz clic para ver más especificaciones.</p>
            </div>
        </div>

        <div class="tarjeta-carro" onclick="abrirModal('dmax')">
            <div class="badge-disponible"><span class="punto-verde"></span> Disponible</div>
            <img src="https://images.unsplash.com/photo-1622146939943-41f2382e21b7?auto=format&fit=crop&w=800&q=80" alt="Isuzu D-Max">
            <div class="info-carro">
                <h2>Isuzu D-Max</h2>
                <p>Haz clic para ver más especificaciones.</p>
            </div>
        </div>
    </section>

    <h2 class="seccion-titulo">Camionetas</h2>
    <section class="grid-catalogo">
        <div class="tarjeta-carro" onclick="abrirModal('prado')">
            <div class="badge-disponible"><span class="punto-verde"></span> Disponible</div>
            <img src="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=800&q=80" alt="Toyota Prado">
            <div class="info-carro">
                <h2>Toyota Prado</h2>
                <p>Haz clic para ver más especificaciones.</p>
            </div>
        </div>
    </section>

    <!-- VENTANA EMERGENTE (Oculta por defecto) -->
    <div id="ventana-info" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
            <img id="modal-img" class="modal-img" src="" alt="Carro">
            <h2 id="modal-titulo" style="color: #F8F9FA;">Cargando...</h2>
            <p id="modal-desc" style="color: #A98467; margin-top: 10px;"></p>
            
            <div class="modal-specs">
                <ul id="lista-especificaciones">
                    <!-- Los datos se inyectarán por JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
